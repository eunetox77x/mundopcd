<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área de Login</title>
    <link rel="stylesheet" type="text/css" href="style pg login.css">
</head>
<body>
    <div class="login-container">
        <h2>Área de Login</h2>
        <form method="POST">
        
            <input type="text" name="username" placeholder="Nome de usuário ou E-mail" required>

            <input type="password" name="password" placeholder="Senha" required>

            <button type="submit">Entrar</button>

            <a href="pg esqueci_senha.html" class="forgot-password">Esqueci minha senha</a>
        </form>
    </div>
</body>
</html>
