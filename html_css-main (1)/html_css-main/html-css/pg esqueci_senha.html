<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci a senha</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}
.login-container {
    background-color: #fff;
    padding: 39px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    width: 300px;
    text-align: center;
}
input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 15px;
    margin-right: 50px;
}

button {
    width: 100%;
    padding: 10px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-size: 16px;
    transition: background-color 0.3s; 
    transition: background-color 0.3s, transform 0.3s; 
}

button:hover {
    background-color: #0056b3;
    transform: scale(1.05);
}
    </style>
</head>
<body>
     <div class="container-esqueci-senha">
        <h2>Esqueci minha Senha</h2>
        <form method="post">
               <input type="text" name="email" placeholder="Digite seu email" required>

               <input type="text" name="senha nova" placeholder="Digite sua nova senha" required>

               <input type="text" name="senha nova" placeholder="Comfirme sua nova senha" required>

               <a href="pagina inicial.html"><button>Cadastrar nova Senha</button></a>
        </form>
     </div>
</body>
</html>
