<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro PCD - Etapa 2</title>
    <link rel="stylesheet" type="text/css" href="style_pg_cadastro2.css">
</head>
<body>
    <h1>Cadastro PCD - Etapa 2</h1>
    
    <div class="timeline">
        <div class="step active">Etapa 1: Dados</div>
        <div class="step active">Etapa 2: Sobre Você</div>
        <div class="step">Etapa 3: Conclusão</div>
    </div>

    <div class="cadastro-container">
        <hr>
        <form method="post" action="cadastro_pcd_pt2.php" enctype="multipart/form-data">
            <label for="deficiencia">Tipo de Deficiência:</label>
            <select id="deficiencia" name="deficiencia" required>
                <option value="" disabled selected>Selecione sua deficiência</option>
                <option value="visual">Visual</option>
                <option value="auditiva">Auditiva</option>
                <option value="física">Física</option>
                <option value="intelectual">Intelectual</option>
                <option value="múltipla">Múltipla</option>
                <option value="outros">Outros</option>
            </select>

            <h2>Laudo (PDF):</h2>
            <input type="file" id="laudo" name="laudo" accept=".pdf" required>

            <h2>Experiência de Trabalho</h2>
            <label for="cargo">Cargo:</label>
            <input type="text" id="cargo" name="cargo" placeholder="Qual seu cargo?" required>

            <label for="experiencia">Descreva sua experiência de trabalho:</label>
            <textarea id="experiencia" name="experiencia" placeholder="Descreva sua experiência" rows="4" required></textarea>

            <h2>Perguntas</h2>
            <label for="motivacao">Por que você deseja trabalhar conosco?</label>
            <textarea id="motivacao" name="motivacao" placeholder="Sua resposta" rows="4" required></textarea>

            <label for="disponibilidade">Qual é a sua disponibilidade para trabalhar?</label>
            <textarea id="disponibilidade" name="disponibilidade" placeholder="Sua resposta" rows="4" required></textarea>

            <a href="pg_cadastro_pt3.html"><button type="submit">Enviar Cadastro</button></a>
        </form>
    </div>
    
</body>
</html>
